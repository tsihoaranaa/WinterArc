name: Build Winter Arc IPA for SideStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Simple Snowflake AppIcon.xcassets
        run: |
          mkdir -p Resources/Assets.xcassets/AppIcon.appiconset
          
          cat << 'EOF' > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > make_icon.swift
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          // Dark slate background (#0B0F19)
          NSColor(calibratedRed: 0.04, green: 0.06, blue: 0.10, alpha: 1.0).setFill()
          NSRect(origin: .zero, size: size).fill()

          // Simple centered cyan snowflake SF Symbol
          let config = NSImage.SymbolConfiguration(pointSize: 520, weight: .medium)
          if let symbol = NSImage(systemSymbolName: "snowflake", accessibilityDescription: nil)?.withSymbolConfiguration(config) {
              let tinted = NSImage(size: symbol.size)
              tinted.lockFocus()
              NSColor(calibratedRed: 0.0, green: 0.82, blue: 1.0, alpha: 1.0).set()
              let symbolRect = NSRect(origin: .zero, size: symbol.size)
              symbolRect.fill()
              symbol.draw(in: symbolRect, from: .zero, operation: .destinationIn, fraction: 1.0)
              tinted.unlockFocus()

              let drawRect = NSRect(
                  x: (1024 - symbol.size.width) / 2,
                  y: (1024 - symbol.size.height) / 2,
                  width: symbol.size.width,
                  height: symbol.size.height
              )
              tinted.draw(in: drawRect)
          }

          image.unlockFocus()

          if let tiff = image.tiffRepresentation,
             let rep = NSBitmapImageRep(data: tiff),
             let png = rep.representation(using: .png, properties: [:]) {
              try! png.write(to: URL(fileURLWithPath: "Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          EOF

          swift make_icon.swift
          rm make_icon.swift

      - name: Generate Xcode Project via XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project WinterArc.xcodeproj \
            -scheme WinterArc \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WinterArc.app Payload/
          zip -r -y WinterArc.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinterArc-IPA
          path: WinterArc.ipa
